<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetCode 看板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>LeetCode 看板 <span class="sub" id="sub">数据结构 × 算法范式</span></h1>
    <div class="actions">
      <nav class="views">
        <button class="view-tab active" data-view="board">矩阵</button>
        <button class="view-tab" data-view="grid">坐标系</button>
      </nav>
      <div class="groupby" id="groupby">
        <button class="gb-btn on" data-by="structures">按结构</button><button class="gb-btn" data-by="paradigms">按范式</button>
      </div>
      <div id="fam-filter" class="fam-filter"></div>
      <span id="count" class="count"></span>
      <div class="todo-wrap">
        <button id="open-todo" class="ghost">📋 TODO<span id="todo-n" class="todo-n hidden"></span></button>
        <div id="todo-pop" class="todo-pop hidden">
          <div class="todo-head">
            <span class="mono">notes/todo.md</span>
            <span id="todo-msg" class="msg"></span>
          </div>
          <input id="todo-in" placeholder="题号或题名… 如 34 / word break,Enter 添加并建文件夹" spellcheck="false">
          <div id="todo-list" class="todo-list"></div>
        </div>
      </div>
      <button id="open-review" class="ghost">🧠 复习<span id="review-n" class="todo-n hidden"></span></button>
      <button id="open-stats" class="ghost" title="复习进度: 到期预测 / 记忆强度 / 历史">📈 进度</button>
      <button id="open-lists" class="ghost">📊 题单</button>
      <button id="open-notes" class="ghost">📓 笔记</button>
      <button id="sync">↻ Sync</button>
    </div>
  </header>

  <main>
    <div id="panel"></div>
    <div id="grid-view" class="hidden"></div>
  </main>

  <!-- detail overlay -->
  <div id="overlay" class="overlay hidden">
    <div class="detail">
      <div class="detail-head">
        <div>
          <span id="d-id" class="pill"></span>
          <span id="d-title" class="d-title"></span>
        </div>
        <button id="close">✕</button>
      </div>

      <div class="tags-editor">
        <div class="tf"><span class="tf-label">结构</span>
          <div class="chipfield" data-field="structures"></div></div>
        <div class="tf"><span class="tf-label">范式</span>
          <div class="chipfield" data-field="paradigms"></div></div>
        <div class="tf"><span class="tf-label">技巧 trick</span>
          <div class="chipfield" data-field="techniques"></div></div>
        <label class="tf sel">难度
          <select id="e-difficulty">
            <option value="">-</option><option>easy</option><option>medium</option><option>hard</option>
          </select>
        </label>
        <label class="tf sel">状态
          <select id="e-status">
            <option>solved</option><option>review</option><option>todo</option>
          </select>
        </label>
        <label class="tf sel">熟练度
          <select id="e-familiarity">
            <option value="">— 未评</option>
            <option value="0">L0 英语讲得清</option>
            <option value="1">L1 已经熟悉</option>
            <option value="2">L2 思路会 · 细节易写错</option>
            <option value="3">L3 思路大概知道 · 不熟</option>
            <option value="4">L4 思路都不知道</option>
          </select>
        </label>
        <span id="meta-msg" class="msg">改动自动保存</span>
      </div>

      <div class="split">
        <section class="pane code-pane">
          <div class="sol-head">
            <div id="sol-tabs" class="tabs"></div>
            <div class="sol-tools">
              <span id="sol-mode" class="hint"></span>
              <button id="sol-save" class="hidden">保存 (Ctrl+S)</button>
              <span id="sol-msg" class="msg"></span>
            </div>
          </div>
          <textarea id="sol-edit" class="hidden" spellcheck="false"
            placeholder="写解法… Ctrl+S 保存，Esc / 点开返回高亮视图"></textarea>
          <pre id="sol-code"><code></code></pre>
          <div id="sol-desc" class="lc-desc hidden"></div>
        </section>
        <section class="pane note-pane">
          <div class="note-head">
            <span id="note-file" class="mono"></span>
            <div>
              <span id="note-mode" class="hint">双击渲染区编辑</span>
              <button id="save-note" class="hidden">保存 (Ctrl+S)</button>
              <span id="note-msg" class="msg"></span>
            </div>
          </div>
          <textarea id="note-edit" class="hidden" spellcheck="false" placeholder="源码编辑中… Ctrl+S 保存，Esc / 点开返回渲染"></textarea>
          <div id="note-preview" class="note-preview" title="双击进入源码编辑"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- FSRS 复习: 看题面 -> 心里过一遍思路 -> 空格揭晓 -> 1-4 自评。
       这一块由 Vue 接管(app.js 里的 ReviewApp) —— 下面是它的 in-DOM 模板,
       别再往里塞 id 然后去 app.js 里 $() 抓, 状态一律走 data/computed。
       其余 overlay 仍然是手写 DOM, 没动。 -->
  <div id="review-app">
    <div class="overlay" :class="{ hidden: !open }" @click.self="close">
      <div class="detail review-detail">
        <div class="detail-head">
          <div>
            <span class="pill" v-text="d ? d.id : ''"></span>
            <span class="d-title" v-text="d ? d.title : ''"></span>
            <span class="hint" v-text="note || metaLine"></span>
          </div>
          <div class="rv-head-right">
            <div class="groupby rv-mode" title="只改队列顺序, 不改题目范围(到期的 + 还没进过复习的)">
              <button v-for="m in MODES" :key="m.k" class="gb-btn" :class="{ on: mode === m.k }"
                      @click="setMode(m.k)" v-text="m.label"></button>
            </div>
            <span class="rv-verdict" :class="verdict.cls" v-text="verdict.text"></span>
            <span class="hint" v-text="d ? (done + 1) + ' / ' + total : ''"></span>
            <button @click="close">✕</button>
          </div>
        </div>

        <div v-if="showEmpty" class="rv-empty">
          <span v-html="emptyMsg"></span>
          <br><button class="ghost rv-stats" @click="toStats">📈 看看复习进度</button>
        </div>

        <template v-else-if="d">
          <div class="rv-card" ref="card">
            <div>
              <div class="rv-ask">
                先在心里说清三件事 —— <b>用什么结构 · 什么范式 · 触发条件是什么</b>。不写代码。
              </div>
              <div class="lc-desc" v-html="descHtml"></div>
              <div v-if="hasQuiz" class="rv-quiz">
                <div class="rv-q" v-for="b in quizBlocks" :key="b.key">
                  <div class="rv-q-label" v-text="b.label"></div>
                  <div class="rv-opts">
                    <span v-if="!b.state" class="rv-q-hint">(这题还没写选项)</span>
                    <button v-else v-for="(t, i) in b.state.opts" :key="i"
                            class="rv-opt" :class="optClass(b.state, i)" @click="pick(b.state, i)">
                      <span class="k" v-text="KEYS[i]"></span><span v-text="t"></span>
                    </button>
                  </div>
                </div>
                <div class="rv-q-hint">选不选都行 —— 直接按空格也能揭晓。选了的话揭晓时会标出对错。</div>
              </div>
            </div>

            <!-- 答案卡: 标签 + 复杂度 + 一句话思路。note/解法退成次要 tab -->
            <div v-if="revealed" id="rv-answer">
              <div class="rv-acard">
                <div class="rv-acard-head">
                  <span class="rv-tagline" v-html="tagline"></span>
                  <span v-if="cxLine" class="rv-cx" v-text="cxLine"></span>
                  <span v-if="!readOnly" class="rv-aedit" title="双击那行思路也能编辑"
                        @click="editing ? cancelEdit() : startEdit()"
                        v-text="editing ? 'Ctrl+S 保存 · Esc 取消' : '改一下'"></span>
                  <span class="msg" v-text="amsg"></span>
                </div>
                <div v-show="!editing" class="rv-idea" title="双击编辑"
                     @dblclick="startEdit" v-html="ideaHtml"></div>
                <textarea v-show="editing" id="rv-aedit-box" ref="aedit" v-model="draft"
                          spellcheck="false" placeholder="一句话思路… Ctrl+S 保存，Esc 取消"></textarea>
              </div>
              <div class="tabs">
                <button v-for="(x, k) in items" :key="k" class="tab" :class="{ on: active === k }"
                        @click="active = k" v-text="x.name"></button>
              </div>
              <div class="rv-body" v-html="bodyHtml"></div>
            </div>
          </div>

          <div class="rv-foot">
            <button v-if="!revealed" class="rv-reveal" @click="reveal">显示答案 <em>空格</em></button>
            <!-- 只读站没有写接口: 没有评分按钮, 只有单纯的「下一题」自测 -->
            <div v-else-if="!readOnly" class="rv-rate">
              <button v-for="r in [1, 2, 3, 4]" :key="r" class="rv-btn" :data-r="r" @click="rate(r)">
                <b v-text="RATE[r][0]"></b>
                <i v-text="fmtInterval(preview[r] || 0)"></i>
                <u v-text="r + ' · ' + RATE[r][1]"></u>
              </button>
            </div>
            <button v-else class="rv-next" @click="skip">下一题 <em>空格</em></button>
            <button class="ghost rv-defer" :class="{ off: !queue.length }" @click="defer"
                    title="不评分 · 不写 FSRS —— 只把这道题挪到本次会话的最后再问一遍">↓ 押到队尾 <em>0</em></button>
          </div>
        </template>
      </div>
    </div>
  </div>
  <!-- list coverage overlay: dashboard/lists.json 是题单定义, 进度现算 -->
  <div id="lists-overlay" class="overlay hidden">
    <div class="detail lists-detail">
      <div class="detail-head">
        <div>
          <span class="pill">题单</span>
          <span id="lists-title" class="d-title">覆盖进度</span>
          <span class="hint">按子主题看缺口 · 点条目打开题, 没建的可以一键建</span>
        </div>
        <button id="lists-close">✕</button>
      </div>
      <div id="lists-tabs" class="tabs lists-tabs"></div>
      <div id="lists-body" class="lists-body"></div>
    </div>
  </div>

  <!-- 📈 复习进度: 全部由 /api/problems 的 fsrs 列 + /api/reviews 现算, 没有第二份状态 -->
  <div id="stats-overlay" class="overlay hidden">
    <div class="detail stats-detail">
      <div class="detail-head">
        <div>
          <span class="pill">进度</span>
          <span class="d-title">FSRS 复习</span>
          <span class="hint">调度状态在各题 meta.json 的 fsrs 字段, 历史在 dashboard/reviews.jsonl</span>
        </div>
        <button id="stats-close">✕</button>
      </div>
      <div id="stats-body" class="stats-body"></div>
    </div>
  </div>

  <!-- cross-cutting notes overlay: notes/*.md + 随想速记 -->
  <div id="notes-overlay" class="overlay hidden">
    <div class="detail notes-detail">
      <div class="detail-head">
        <div>
          <span class="pill">笔记</span>
          <span class="d-title">notes/</span>
          <span class="hint">不属于任何单题的东西 —— 方法论、模板、随想</span>
        </div>
        <button id="notes-close">✕</button>
      </div>
      <div class="notes-body">
        <aside class="notes-side">
          <div class="scratch-box">
            <input id="scratch-in" placeholder="随想… (Enter 存进 scratch.md)" spellcheck="false">
            <span id="scratch-msg" class="msg"></span>
          </div>
          <div id="notes-list" class="notes-list"></div>
          <button id="note-new" class="ghost note-new">+ 新建笔记</button>
        </aside>
        <section class="pane note-pane">
          <div class="note-head">
            <span id="nt-file" class="mono"></span>
            <div>
              <span id="nt-mode" class="hint">双击渲染区编辑</span>
              <button id="nt-save" class="hidden">保存 (Ctrl+S)</button>
              <span id="nt-msg" class="msg"></span>
            </div>
          </div>
          <textarea id="nt-edit" class="hidden" spellcheck="false"></textarea>
          <div id="nt-preview" class="note-preview" title="双击进入源码编辑"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- data-structure trick doc overlay -->
  <div id="doc-overlay" class="overlay hidden">
    <div class="detail doc">
      <div class="detail-head">
        <div>
          <span class="pill" id="doc-kind">结构</span>
          <span id="doc-title" class="d-title"></span>
          <span class="hint">通用 trick 速查</span>
        </div>
        <button id="doc-close">✕</button>
      </div>
      <div class="note-pane doc-pane">
        <div class="note-head">
          <span id="doc-file" class="mono"></span>
          <div>
            <span id="doc-mode" class="hint">双击渲染区编辑</span>
            <button id="doc-save" class="hidden">保存 (Ctrl+S)</button>
            <span id="doc-msg" class="msg"></span>
          </div>
        </div>
        <textarea id="doc-edit" class="hidden" spellcheck="false" placeholder="写这个数据结构的通用套路 / trick…"></textarea>
        <div id="doc-preview" class="note-preview" title="双击进入源码编辑"></div>
      </div>
    </div>
  </div>

  <script src="vendor/vue.global.prod.js"></script>
  <script src="app.js"></script>
</body>
</html>
