# 把看板导出成只读静态站发到 GitHub Pages -> https://scatyf3.github.io/leetcode/
#   /        LeetCode 看板          (tracker/)
#   /jobs/   求职看板(只有方法论, 没有投递数据)
#   /blog/   知识库 VitePress 站    (blog/)
# 写入口在构建时就被剥掉了(见 dashboard/web/public/static-shim.js), 线上没有任何可写接口。
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker     # 看板那一套都在 tracker/ 下; blog 那几步单独指目录
    steps:
      - uses: actions/checkout@v4
      # 前端: Vite 构建 -> dashboard/web/dist/。单测挂了就不发布
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tracker/package-lock.json
            blog/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dashboard/export_static.py dist   # 后端纯标准库, 没有依赖要装
      # 求职看板挂在 /jobs/ 子路径。**必须在 dashboard 之后** —— 那个 export 会先
      # rmtree(dist) 重建, 反过来跑的话 dist/jobs 会被它整个删掉。
      # 线上只有方法论, 投递状态不导出(见 jobs/export_static.py 的 EXPORT_APPLICATIONS)。
      - run: python jobs/export_static.py dist/jobs
      # 知识库挂在 /blog/ 子路径(config.mts 的 base)。同理必须在 dashboard export 之后。
      # 构建时会读 tracker/*/meta.json 给每篇列题, 所以 checkout 要带上 tracker/(默认就带)。
      - run: npm ci && npm run docs:build
        working-directory: blog
      - run: cp -r ../blog/docs/.vitepress/dist dist/blog
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
